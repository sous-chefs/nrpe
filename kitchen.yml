---
driver:
  name: vagrant

provisioner:
  name: policyfile_zero
  multiple_converge: 2
  enforce_idempotency: true
  deprecations_as_errors: true
  chef_license: accept-no-persist

verifier:
  name: inspec

platforms:
  - name: almalinux-8
  - name: almalinux-9
  - name: amazonlinux-2023
  - name: centos-stream-9
  - name: debian-12
  - name: fedora-latest
  - name: oraclelinux-8
  - name: oraclelinux-9
  - name: rockylinux-8
  - name: rockylinux-9
  - name: ubuntu-22.04
  - name: ubuntu-24.04

x-run_lists:
  default: &default_run_list
    - recipe[test::default]
  check: &check_run_list
    - recipe[test::check]
  source: &source_run_list
    - recipe[test::source]

x-verifiers:
  default: &default_verifier
    inspec_tests:
      - path: test/integration/default
  check: &check_verifier
    inspec_tests:
      - path: test/integration/check
  source: &source_verifier
    inspec_tests:
      - path: test/integration/source

suites:
  - name: default
    run_list: *default_run_list
    verifier: *default_verifier
  - name: source
    run_list: *source_run_list
    verifier: *source_verifier
  - name: check
    run_list: *check_run_list
    verifier: *check_verifier
